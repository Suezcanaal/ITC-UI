
services:
  - type: web
    name: intelligent-traffic-system
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "gunicorn its_project.wsgi"
    envVars:
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: its-db
          property: connectionString
databases:
  - name: its-db
